name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# This workflow deliberately skips lint, typecheck, formatting, and tests so an
# emergency release is never blocked by CI. Those gates run on every pull
# request; only run this workflow from a commit that passed them.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'

      - name: Install dependencies and build
        env:
          ZERION_API_URL: https://zpi.zerion.io/
          ZERION_TESTNET_API_URL: https://zpi-testnet.zerion.io/
          PROXY_URL: https://proxy.zerion.io/
          TEST_WALLET_ADDRESS: ${{ secrets.TEST_WALLET_ADDRESS }}
          MIXPANEL_TOKEN_PUBLIC: ${{ secrets.MIXPANEL_TOKEN_PUBLIC_PROD }}
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ secrets.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          GOOGLE_ANALYTICS_API_SECRET: ${{ secrets.GOOGLE_ANALYTICS_API_SECRET }}
          FEATURE_LOYALTY_FLOW: on
          FEATURE_SOLANA: on
        run: |
          npm ci
          npm run build:production

      # Store uploads need the manifest at the archive root, which differs from
      # the release artifacts below (one containing directory). They are handed
      # to the `submit-stores` job, which holds the store credentials.
      - name: Create store artifacts
        run: node scripts/release/store-zips.mjs --tag=${{ github.ref_name }}

      - name: Upload store artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-artifacts
          path: store-artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Compress build artifacts
        shell: bash
        run: |
          mv dist zerion-wallet-extension-${{github.ref_name}}
          zip -r zerion-wallet-extension-${{github.ref_name}}.zip zerion-wallet-extension-${{github.ref_name}}
          tar czf zerion-wallet-extension-${{github.ref_name}}.tar.gz --directory=zerion-wallet-extension-${{github.ref_name}} .
          mv dist-firefox zerion-wallet-firefox-addon-${{github.ref_name}}
          zip -r zerion-wallet-firefox-addon-${{github.ref_name}}.zip zerion-wallet-firefox-addon-${{github.ref_name}}
          tar czf zerion-wallet-firefox-addon-${{github.ref_name}}.tar.gz --directory=zerion-wallet-firefox-addon-${{github.ref_name}} .

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          generateReleaseNotes: true
          artifacts: 'zerion-wallet-extension-${{github.ref_name}}.zip,zerion-wallet-extension-${{github.ref_name}}.tar.gz,zerion-wallet-firefox-addon-${{github.ref_name}}.zip,zerion-wallet-firefox-addon-${{github.ref_name}}.tar.gz'

      - name: Notify release
        id: notify-release
        if: ${{ success() }}
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        with:
          channel-id: 'C04JLLQRB43'
          payload: |
            {
              "text": "New release",
              "icon_emoji": ":gift:",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, github.ref_name)}}|${{ github.ref_name }}>"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Created by:* ${{ github.triggering_actor }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_AUTH_TOKEN }}

  submit-stores:
    name: Submit release to the stores
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Store credentials live in this environment, not in the repository. Adding
    # required reviewers here gates the upload only; the release above already
    # happened.
    environment: store-publishing
    permissions:
      contents: read
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download store artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: store-artifacts
          path: store-artifacts

      - name: Submit release to the stores
        if: ${{ env.CHROME_EXTENSION_ID != '' || env.FIREFOX_EXTENSION_ID != '' }}
        env:
          # Production upload only: the release is published from the Chrome
          # Web Store dashboard, where the canary/staged rollout is controlled.
          CHROME_SKIP_SUBMIT_REVIEW: 'true'
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          STORE=all
          if [ -z "$CHROME_EXTENSION_ID" ]; then STORE=firefox; fi
          if [ -z "$FIREFOX_EXTENSION_ID" ]; then STORE=chrome; fi
          node scripts/release/publish-stores.mjs --store="$STORE" \
            --chrome-zip="$(ls store-artifacts/chrome/*.zip)" \
            --firefox-zip="$(ls store-artifacts/firefox/*.zip | grep -v sources)" \
            --firefox-sources-zip="$(ls store-artifacts/firefox/*-sources.zip)"

      - name: Notice when store upload is skipped
        if: ${{ env.CHROME_EXTENSION_ID == '' && env.FIREFOX_EXTENSION_ID == '' }}
        run: |
          echo "::notice::CHROME_EXTENSION_ID and FIREFOX_EXTENSION_ID are not configured; release published without store upload."
