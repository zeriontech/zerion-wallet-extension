name: CI

# Pull-request CI: the changeset gate, the shared quality workflow, the
# production build (whose zip is attached to the PR) and e2e. `main` is gated by
# `beta.yml`, which calls the same quality workflow alongside its beta build.
# Mirrors `zerion-web-app`'s `ci.yml`.
on:
  pull_request:
    # `labeled` / `unlabeled` exist so the `skip-changeset` label can satisfy
    # the changeset gate without a new commit, and `ENV_*` labels feed the build.
    # The heavy jobs ignore label-only events.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Non-secret configuration only. Secrets are scoped to the step that needs
# them, so lint/typecheck/unit never run with credentials in the environment.
env:
  ZERION_API_URL: https://zpi.zerion.io/
  ZERION_TESTNET_API_URL: https://zpi-testnet.zerion.io/
  BACKEND_ENV: ''
  PROXY_URL: https://proxy.zerion.io/
  # Public wallet from e2e/fixtures/constants.ts. Unit tests and E2E use it;
  # it is not a secret.
  TEST_WALLET_ADDRESS: '0xc3A6672F5c9Ef31E5a086B1C80Ba1Ac73F95Cbb1'

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  # A label-only run stays in the same group but must not evict the run that is
  # already executing: `changeset-check` is the only job it does, so cancelling
  # would leave the pull request with no quality or build result at all (the
  # heavy jobs skip on label events). Queued instead.
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

permissions:
  contents: read

jobs:
  changeset-check:
    name: Changeset
    # The Version Packages PR is generated by CI and carries no changeset.
    # `skip-changeset` is for docs/CI/dependency-only PRs.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Require a changeset
        run: |
          if ! npx changeset status --since=origin/main; then
            echo "::error::This PR has no changeset. Run \`npm run changeset\`, commit the generated .changeset/*.md file, and push. If the change does not need a release note (docs/CI/deps only), add the \`skip-changeset\` label."
            exit 1
          fi

  quality:
    name: Quality
    # Label-only events exist for the changeset gate; do not re-run the suite.
    if: >-
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    uses: ./.github/workflows/_quality.yml
    secrets: inherit

  build:
    name: Build
    # Same-repo pull requests only: the build uses repository secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `ENV_*` labels on the PR set build flags (e.g. `ENV_FEATURE_LOYALTY_FLOW`).
      # Runs before the build so the exported values reach it.
      - name: Apply environment labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/set-env-from-pr-labels.sh "$PR_NUMBER"

      - name: Build production extension
        env:
          TEST_WALLET_ADDRESS: '0xc3A6672F5c9Ef31E5a086B1C80Ba1Ac73F95Cbb1'
          MIXPANEL_TOKEN_PUBLIC: ${{ secrets.MIXPANEL_TOKEN_PUBLIC_DEV }}
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ secrets.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          GOOGLE_ANALYTICS_API_SECRET: ${{ secrets.GOOGLE_ANALYTICS_API_SECRET }}
          FEATURE_LOYALTY_FLOW: off
          FEATURE_SOLANA: on
        run: |
          npm run build:production
          mv dist zerion-wallet-extension-${{ github.sha }}
          zip -r zerion-wallet-extension-${{ github.sha }}.zip zerion-wallet-extension-${{ github.sha }}

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerion-wallet-extension
          path: zerion-wallet-extension-${{ github.sha }}.zip
          retention-days: 7
          if-no-files-found: error

      # One comment per PR, updated on every run, like the web app's size and
      # preview comments.
      - name: Link the build on the pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        with:
          script: |
            const { PR_NUMBER, RUN_URL } = process.env;
            if (!PR_NUMBER) return;
            const issue_number = Number(PR_NUMBER);
            const { owner, repo } = context.repo;
            const body = `:package: [build.zip](${RUN_URL}) [updated at ${new Date().toISOString()}]`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) =>
              comment.body.startsWith(':package:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
