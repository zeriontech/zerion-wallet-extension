name: CI

# One workflow for everything a change has to pass: the changeset gate, static
# checks, unit tests, the production build (whose zip is attached to the PR) and
# e2e. Mirrors `zerion-web-app`'s `ci.yml`.
on:
  pull_request:
    # `labeled` / `unlabeled` exist so the `skip-changeset` label can satisfy
    # the changeset gate without a new commit, and `ENV_*` labels feed the build.
    # The heavy jobs ignore label-only events.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      BACKEND_ENV:
        default: ''
        description: 'Backend env for special features'
        required: false
      ZERION_API_URL:
        default: https://zpi.zerion.io/
        description: 'Zerion REST API'
        required: true
      ZERION_TESTNET_API_URL:
        default: https://zpi-testnet.zerion.io/
        description: 'Zerion REST API'
        required: true
      PROXY_URL:
        default: https://proxy.zerion.io/
        description: 'Proxy API'
        required: true
      DEFI_SDK_TRANSACTIONS_API_URL:
        default: https://transactions.zerion.io
        description: 'Transaction Builder API'
        required: true
      PR_NUMBER:
        default: ''
        description: 'Pull request to attach the build to, e.g. 468'
        required: false

# Non-secret configuration only. Secrets are scoped to the step that needs
# them, so lint/typecheck/unit never run with credentials in the environment.
env:
  ZERION_API_URL: ${{ github.event.inputs.ZERION_API_URL || 'https://zpi.zerion.io/' }}
  ZERION_TESTNET_API_URL: ${{ github.event.inputs.ZERION_TESTNET_API_URL || 'https://zpi-testnet.zerion.io/' }}
  BACKEND_ENV: ${{ github.event.inputs.BACKEND_ENV || '' }}
  PROXY_URL: ${{ github.event.inputs.PROXY_URL || 'https://proxy.zerion.io/' }}
  DEFI_SDK_TRANSACTIONS_API_URL: ${{ github.event.inputs.DEFI_SDK_TRANSACTIONS_API_URL || 'https://transactions.zerion.io' }}
  # Public wallet from e2e/fixtures/constants.ts. Unit tests and E2E use it;
  # it is not a secret.
  TEST_WALLET_ADDRESS: '0xc3A6672F5c9Ef31E5a086B1C80Ba1Ac73F95Cbb1'
  FEATURE_SEND_FORM: on

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset-check:
    name: Changeset
    # The Version Packages PR is generated by CI and carries no changeset.
    # `skip-changeset` is for docs/CI/dependency-only PRs.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Require a changeset
        run: |
          if ! npx changeset status --since=origin/main; then
            echo "::error::This PR has no changeset. Run \`npm run changeset\`, commit the generated .changeset/*.md file, and push. If the change does not need a release note (docs/CI/deps only), add the \`skip-changeset\` label."
            exit 1
          fi

  static:
    # Label-only events exist for the changeset gate; do not re-run the suite.
    if: >-
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        # Dependency lifecycle scripts must not run with credentials in the
        # environment; this job has none.
        run: npm ci --ignore-scripts

      # All three run through the Vite+ toolchain (Oxlint, Oxfmt, TSRS).
      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  test:
    name: Tests
    if: >-
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Vitest on the `vmThreads` pool: one job, no shards.
      - name: Run unit tests
        run: npm run test:unit

  build:
    name: Build
    # Fork PRs must not run this job: it builds with repository secrets.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `ENV_*` labels on the PR set build flags (e.g. `ENV_FEATURE_BRIDGE_FORM`).
      # Runs before the build so the exported values reach it.
      - name: Apply environment labels
        if: ${{ github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.PR_NUMBER || github.event.pull_request.number }}
        run: .github/scripts/set-env-from-pr-labels.sh "$PR_NUMBER"

      - name: Build production extension
        env:
          TEST_WALLET_ADDRESS: '0xc3A6672F5c9Ef31E5a086B1C80Ba1Ac73F95Cbb1'
          MIXPANEL_TOKEN_PUBLIC: ${{ secrets.MIXPANEL_TOKEN_PUBLIC_DEV }}
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ secrets.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          GOOGLE_ANALYTICS_API_SECRET: ${{ secrets.GOOGLE_ANALYTICS_API_SECRET }}
          FEATURE_BRIDGE_FORM: on
          FEATURE_LOYALTY_FLOW: off
          FEATURE_SOLANA: on
        run: |
          npm run build:production
          mv dist zerion-wallet-extension-${{ github.sha }}
          zip -r zerion-wallet-extension-${{ github.sha }}.zip zerion-wallet-extension-${{ github.sha }}

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerion-wallet-extension
          path: zerion-wallet-extension-${{ github.sha }}.zip
          retention-days: 7
          if-no-files-found: error

      # One comment per PR, updated on every run, like the web app's size and
      # preview comments.
      - name: Link the build on the pull request
        if: ${{ github.event_name != 'push' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.PR_NUMBER || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        with:
          script: |
            const { PR_NUMBER, RUN_URL } = process.env;
            if (!PR_NUMBER) return;
            const issue_number = Number(PR_NUMBER);
            const { owner, repo } = context.repo;
            const body = `:package: [build.zip](${RUN_URL}) [updated at ${new Date().toISOString()}]`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) =>
              comment.body.startsWith(':package:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  e2e:
    # Pull requests only: post-merge builds are covered by `beta.yml` and the
    # release, and e2e is the expensive part of this workflow.
    # Only these jobs receive the Cloudflare bypass secret. The extension is
    # built against a local proxy, so the secret never reaches Chromium,
    # traces, or the build output.
    #
    # Five shards, balanced by measured duration rather than Playwright's
    # index split (which left 56s/28s/32s). `scripts/e2e-shards.mjs` packs the
    # 22 extension tests and the 13 dapp tests into five balanced groups and a
    # `--verify` step fails if any test is not assigned to exactly one shard.
    #
    # Dapp tests use the hosted test dapp via DAPP_URL and are skipped when
    # DAPP_URL is unset (for local runs of the extension suite).
    #
    # `--workers=2` per shard: two workers keep the test step short; each test
    # still gets its own browser context, so isolation is unchanged.
    name: e2e (${{ matrix.shard }}/5)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      DAPP_URL: https://zeriontech.github.io/zerion-test-dapp/
      E2E_PROXY_PORT: '4789'
      # The build has no secret; it only needs to point at the proxy.
      E2E_USE_PROXY: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: npm

      # Sharding multiplies setup cost, so the install and the browser download
      # are cached on the lockfile hash instead of being paid once per shard.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Cache Playwright Chromium
        id: playwright-browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--with-deps` also installs Chromium's system libraries on a cache miss.
      # On a cache hit the step is skipped: the ubuntu-latest image already ships
      # those libraries, and `playwright install-deps` cost 10-19s of apt per
      # shard, which was most of the non-test budget. A missing library fails
      # loudly at browser launch, not silently.
      - name: Install Playwright Chromium
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify ZPI development secret
        env:
          ZERION_API_DEVELOPMENT_KEY: ${{ secrets.ZERION_API_DEVELOPMENT_KEY || secrets.CF_ZPI_DEV_BYPASS_SECRET }}
        run: |
          if [ -z "$ZERION_API_DEVELOPMENT_KEY" ]; then
            echo "::error::Neither ZERION_API_DEVELOPMENT_KEY nor CF_ZPI_DEV_BYPASS_SECRET is available to this repository. E2E tests will be blocked by the ZPI Cloudflare challenge."
            exit 1
          fi

      - name: Build E2E extension
        # No secret in this step: the build only knows the local proxy URL.
        run: npm run build:e2e

      - name: Select shard
        id: shard
        run: node scripts/e2e-shards.mjs --shard=${{ matrix.shard }} --total=5 >> "$GITHUB_OUTPUT"

      - name: Verify shard coverage
        # Fails if a test is not assigned to exactly one shard, e.g. after a
        # test is added or renamed.
        run: node scripts/e2e-shards.mjs --verify --total=5

      - name: Run Playwright tests (shard ${{ matrix.shard }}/5)
        id: e2e
        env:
          ZERION_API_DEVELOPMENT_KEY: ${{ secrets.ZERION_API_DEVELOPMENT_KEY || secrets.CF_ZPI_DEV_BYPASS_SECRET }}
          E2E_GREP: ${{ steps.shard.outputs.grep }}
        run: xvfb-run npx playwright test --grep "$E2E_GREP" --workers=2

      - name: Scan Playwright report for the bypass secret
        id: scan
        if: failure() && steps.e2e.outcome == 'failure'
        env:
          ZERION_API_DEVELOPMENT_KEY: ${{ secrets.ZERION_API_DEVELOPMENT_KEY || secrets.CF_ZPI_DEV_BYPASS_SECRET }}
        run: node scripts/scan-for-secret.mjs e2e-report

      - name: Upload Playwright report
        # Artifacts of a public repository are public. Never upload the build,
        # and never upload a report the scanner has not cleared.
        # `failure()` is explicit: GitHub otherwise adds an implicit success()
        # check, which is false after the Playwright step fails.
        if: failure() && steps.e2e.outcome == 'failure' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report-${{ matrix.shard }}
          path: e2e-report/
          retention-days: 7
          if-no-files-found: ignore
