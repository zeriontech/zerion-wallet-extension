name: 'Push build to QA repository'

inputs:
  branch_name:
    description: 'Branch name to push to'
    required: true
  commit_message:
    description: 'Commit message for the push'
    required: true
  repo_token:
    description: "Token with contents:write on zerion-wallet-extension-qa (GitHub App installation token)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create branch in another repository and copy files
      env:
        REPO_TOKEN: ${{ inputs.repo_token }}
        BRANCH_NAME: ${{ inputs.branch_name }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
      run: |
        TARGET_REPO="github.com/zeriontech/zerion-wallet-extension-qa.git"

        if [[ ! "$BRANCH_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] ||
          [[ "$BRANCH_NAME" == *..* ]] ||
          [[ "$BRANCH_NAME" == *//* ]] ||
          [[ "$BRANCH_NAME" == *"@{"* ]] ||
          [[ "$BRANCH_NAME" == */ ]] ||
          [[ "$BRANCH_NAME" == *"." ]] ||
          [[ "$BRANCH_NAME" == *.lock ]]; then
          echo "Invalid branch name supplied to the QA repository action."
          exit 1
        fi

        git config --global user.email "zerts@zerion.io"
        git config --global user.name "QA Bot"

        ASKPASS_SCRIPT="${RUNNER_TEMP}/qa-git-askpass.sh"
        trap 'rm -f "$ASKPASS_SCRIPT"' EXIT
        cat > "$ASKPASS_SCRIPT" <<'EOF'
        #!/usr/bin/env bash
        printf '%s\n' "$REPO_TOKEN"
        EOF
        chmod 700 "$ASKPASS_SCRIPT"
        export GIT_ASKPASS="$ASKPASS_SCRIPT"
        export GIT_TERMINAL_PROMPT=0

        # Clone the target repository without placing the token in the command line.
        git clone "https://x-access-token@${TARGET_REPO}" qa-repository

        cd qa-repository

        # Create or switch to the new branch
        git checkout "$BRANCH_NAME" || git checkout -b "$BRANCH_NAME"

        # Copy files from the dist directory
        mkdir -p extension-build
        cp -r ../dist/* ./extension-build
        mkdir -p firefox-build
        cp -r ../dist-firefox/* ./firefox-build 

        # Commit and push changes
        git add .
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "$COMMIT_MESSAGE"
        git push origin "$BRANCH_NAME"
      shell: bash
