<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="initial-scale=1, user-scalable=no" />

    <!-- Prevent showing translate prompt when popup.html is used as a dialog -->
    <meta name="google" value="notranslate" />

    <style>
      /* Prevent UI to blink with a white background in the dark theme when open */
      /* --default-background variable is updated later to reflect the actual selected theme */
      body {
        background-color: var(--default-background, white);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: var(--default-background, #16161a);
        }
      }
      body::-webkit-scrollbar {
        /* display: none; */
        visibility: hidden;
        width: 0px;
      }
    </style>
    <!-- Preloading fonts helps avoid FOIT and some jumps -->
    <link
      rel="preload"
      href="./style/fonts/AeonikPro-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./style/fonts/AeonikPro-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
